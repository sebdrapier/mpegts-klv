name: Bug report
description: KLV is missing, wrong or different from what ffmpeg extracts
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The code you ran, and `ffprobe -show_programs -show_streams` output for the file. A small sample file helps a lot.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: e.g. packet counts per PID compared with `ffprobe -select_streams d -count_packets`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mpegts-klv version and runtime
      placeholder: 0.1.0, Chrome 140 / Node 24 / Bun 1.4
